<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Spider Stats spider inside a sniper-style reticle</title>
  <defs>
    <radialGradient id="halo"><stop stop-color="#ff4655" stop-opacity=".2"/><stop offset="1" stop-color="#ff4655" stop-opacity="0"/></radialGradient>
    <linearGradient id="abdomen" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#f6f3ef"/><stop offset=".48" stop-color="#b8b8bb"/><stop offset="1" stop-color="#5e171f"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#halo)"/>
  <!-- Fine radial web and scope lines frame the spider as the target. -->
  <g fill="none" stroke="#ff4655" stroke-linecap="round" opacity=".33">
    <circle cx="64" cy="64" r="37"/><circle cx="64" cy="64" r="51"/>
    <path d="M64 9v23M64 96v23M9 64h24M96 64h12M25 25l17 17M87 87l16 16M103 25 87 41M41 87l-16 16"/>
    <path d="m64 27 9 26 28 11-28 11-9 27-11-27-27-11 27-11z" opacity=".65"/>
  </g>
  <!-- Eight articulated legs, shaped with a natural bend. -->
  <g fill="none" stroke="#eee9e6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M51 49Q46 42 40 39L32 36 25 29 17 27M49 56Q41 52 35 54L27 59 20 59 13 55M48 65Q40 66 35 71L29 78 22 81 17 78M51 73Q45 79 43 86L42 94 36 101 30 103"/>
    <path d="M60 49Q65 42 71 39L79 36 86 29 94 27M62 56Q70 52 76 54L84 59 91 59 98 55M63 65Q71 66 76 71L82 78 89 81 94 78M60 73Q66 79 68 86L69 94 75 101 81 103"/>
  </g>
  <g fill="#ff4655" opacity=".88"><circle cx="40" cy="39" r="2.2"/><circle cx="35" cy="54" r="2.2"/><circle cx="35" cy="71" r="2.2"/><circle cx="43" cy="86" r="2.2"/><circle cx="71" cy="39" r="2.2"/><circle cx="76" cy="54" r="2.2"/><circle cx="76" cy="71" r="2.2"/><circle cx="68" cy="86" r="2.2"/></g>
  <!-- Segmented body and small eyes make the spider read as an arachnid at icon size. -->
  <g stroke="#ff4655" stroke-width="1.5">
    <ellipse cx="56" cy="68" rx="11.5" ry="17" fill="url(#abdomen)"/>
    <path d="M48 64q8-5 16 0M47 70q9-5 18 0M49 76q7-4 14 0" fill="none" opacity=".72"/>
    <ellipse cx="56" cy="47" rx="8.5" ry="9" fill="#252329"/>
  </g>
  <g fill="#fff3ee"><circle cx="51" cy="45" r="1.2"/><circle cx="55" cy="43.5" r="1.35"/><circle cx="59" cy="43.5" r="1.35"/><circle cx="63" cy="45" r="1.2"/></g>
  <path d="M56 84v-5m-3 5 3 4 3-4" fill="none" stroke="#ff4655" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
